<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1940" viewBox="0 0 2200 1940" role="img" aria-labelledby="title desc"><title id="title">Architect 2.0 - hosted prototype, verified development backend and proposed runtime</title><desc id="desc">The prototype is published at https://architect-2-weld.vercel.app with public source at https://github.com/rishimunikesarwani-hub/architect-2 as of 2026-10-06. The development backend is deployed with 15 passing live API checks for login ID authentication, department permissions and revision conflicts. Hosted Chrome owner and independent Edge member checks passed for session reload, shared edits, preserved conflicting drafts and explicit discard, live viewer controls, revocation/restoration and logout/re-entry. Browser signup was user-performed, not observed. After the user enabled Chrome file-access permission, hosted ZIP file-picker import of the exact two-file fixture into a new private Custom app passed, including preview interaction, a saved source edit and source/README persistence after reload. JSON source export and conflict-draft HTML arrival for the same synthetic QA app are verified by exact file hashes; no ZIP export is claimed. Google is deferred. AgentLibrary remains fictional; agent registry and runtime grants remain proposed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#52665b" stroke-width="1.5"/></marker><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#20362a}.title{font-size:42px;font-weight:700}.subtitle{font-size:23px;fill:#53665b}.section{font-size:25px;font-weight:700}.node-title{font-size:26px;font-weight:650}.body{font-size:21px}.small{font-size:19px;fill:#566a5e}.tag{font-size:15px;font-weight:700;letter-spacing:.6px}.label{font-size:18px;fill:#52665b}.edge{fill:none;stroke:#52665b;stroke-width:2;marker-end:url(#arrow)}.future{stroke-dasharray:8 6}</style></defs><rect width="2200" height="1940" fill="#f7f9f5"/>
